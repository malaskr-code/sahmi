<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#C9A227">
    <title>Sahmi — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #FBF8F1; color: #243247; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 36px 28px; border: 1px solid #C9A227; border-radius: 24px; background: rgba(255,255,255,.58); text-align: center; box-shadow: 0 18px 60px rgba(36,50,71,.08); }
      .brand { color: #9B7A1C; font: 700 32px Georgia, serif; }
      h1 { margin: 24px 0 8px; font: 700 24px Georgia, serif; }
      p { margin: 8px 0; line-height: 1.6; }
      .ar { direction: rtl; font-family: system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) {
        :root { background: #101827; color: #F3EEE3; }
        main { background: #1B2A44; box-shadow: 0 18px 60px rgba(0,0,0,.24); }
        .brand { color: #D9B84D; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Sahmi <span lang="ar" class="ar">سهمي</span></div>
      <h1>You're offline</h1>
      <p>Please reconnect to the internet and try again.</p>
      <h1 lang="ar" class="ar">أنت غير متصل بالإنترنت</h1>
      <p lang="ar" class="ar">يرجى الاتصال بالإنترنت والمحاولة مرة أخرى.</p>
    </main>
  </body>
</html>
